# ServicePro Next.js app — Docker Compose stack.
#
# Uso:
#   docker compose up -d                       — só o app, expõe porta 8756
#   docker compose --profile tunnel up -d      — app + Cloudflare Tunnel
#
# Tunnel Setup (named, persistente):
#   1. dash.cloudflare.com → Zero Trust → Networks → Tunnels → Create
#   2. Nome: servicepro-app   (ou outro)
#   3. Copie o token, coloque em .env:  CLOUDFLARE_TUNNEL_TOKEN=eyJ...
#   4. No tunnel: Public Hostname
#        Subdomain: app   (ou escolha o que quiser)
#        Domain: seu-dominio.com
#        Service → Type: HTTP   URL: app:3000
#   5. docker compose --profile tunnel up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
        - NEXT_PUBLIC_META_APP_ID=${NEXT_PUBLIC_META_APP_ID}
    image: servicepro-app:latest
    container_name: servicepro-app
    restart: unless-stopped
    # Porta host aleatória alta (evita conflito com outros containers que você roda)
    # Porta interna do Next.js continua 3000 — host 8756 é só pra acesso local direto.
    # Cloudflared (abaixo) alcança via nome do serviço na rede Docker, não precisa desse mapeamento.
    ports:
      - "${APP_PORT:-8756}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # Sessões Baileys — precisam persistir entre restarts. Remova se usar só WhatsApp Cloud API.
      - ./whatsapp-sessions:/app/whatsapp-sessions
      # Se usa firebase-admin com service account file, monte aqui (não inclua na imagem):
      - ./firebase-admin-service-account.json:/app/firebase-admin-service-account.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "1536M"
        reservations:
          cpus: "0.5"
          memory: "512M"
    networks:
      - app-net

  # Cloudflare Tunnel pro Next.js — só sobe com --profile tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: servicepro-app-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --protocol http2
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-net
    profiles:
      - tunnel

  # Cron interno — dispara endpoints scheduled do saas-erp.
  # Self-contained (não depende de cron-job.org externo). Roda sempre.
  #   - process-scheduled (broadcasts):       a cada 1 minuto
  #   - agent/scheduled/run (agente IA):      a cada 1 hora
  #   - birthday-campaigns/run (aniversário): a cada 1 hora
  # Todos autenticam com Authorization: Bearer ${CRON_SECRET}
  # Usa o nome do serviço Docker (`app:3000`) na rede interna — não vai
  # pelo Cloudflare/internet (mais rápido e não consome quota tunnel).
  cron:
    image: alpine:3.19
    container_name: servicepro-cron
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      - CRON_SECRET=${CRON_SECRET}
    command: |
      sh -c '
        apk add --no-cache curl > /dev/null 2>&1
        echo "[cron] iniciado — process-scheduled a cada 1min, agent + birthday a cada 1h"
        TICK=0
        while true; do
          # broadcasts: a cada 1 minuto
          curl -fsS -m 30 -o /dev/null \
            -H "Authorization: Bearer $$CRON_SECRET" \
            http://app:3000/api/broadcasts/process-scheduled \
            || echo "[cron] process-scheduled falhou em $$(date -Iseconds)"

          # tarefas horárias: rodam quando TICK é múltiplo de 60 (1x por hora).
          # Disparam em sequência pra evitar pico simultâneo na app.
          if [ $$((TICK % 60)) -eq 0 ]; then
            # agente IA
            curl -fsS -m 60 -o /dev/null \
              -H "Authorization: Bearer $$CRON_SECRET" \
              http://app:3000/api/agent/scheduled/run \
              || echo "[cron] agent/scheduled/run falhou em $$(date -Iseconds)"

            # campanhas de aniversário (varre clientes elegíveis e dispara
            # mensagens conforme sendAtHour de cada campanha; idempotente
            # via birthdayCampaignLogs/{campaignId_clientId_year})
            curl -fsS -m 120 -o /dev/null \
              -H "Authorization: Bearer $$CRON_SECRET" \
              http://app:3000/api/birthday-campaigns/run \
              || echo "[cron] birthday-campaigns/run falhou em $$(date -Iseconds)"
          fi

          TICK=$$((TICK + 1))
          sleep 60
        done
      '
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
    name: servicepro-app-net
