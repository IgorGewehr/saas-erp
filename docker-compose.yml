# ServicePro Next.js app — Docker Compose stack.
#
# Uso:
#   docker compose up -d                       — só o app, expõe porta 8756
#   docker compose --profile tunnel up -d      — app + Cloudflare Tunnel
#
# Tunnel Setup (named, persistente):
#   1. dash.cloudflare.com → Zero Trust → Networks → Tunnels → Create
#   2. Nome: servicepro-app   (ou outro)
#   3. Copie o token, coloque em .env:  CLOUDFLARE_TUNNEL_TOKEN=eyJ...
#   4. No tunnel: Public Hostname
#        Subdomain: app   (ou escolha o que quiser)
#        Domain: seu-dominio.com
#        Service → Type: HTTP   URL: app:3000
#   5. docker compose --profile tunnel up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
        - NEXT_PUBLIC_META_APP_ID=${NEXT_PUBLIC_META_APP_ID}
    image: servicepro-app:latest
    container_name: servicepro-app
    restart: unless-stopped
    # Porta host aleatória alta (evita conflito com outros containers que você roda)
    # Porta interna do Next.js continua 3000 — host 8756 é só pra acesso local direto.
    # Cloudflared (abaixo) alcança via nome do serviço na rede Docker, não precisa desse mapeamento.
    ports:
      - "${APP_PORT:-8756}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # Sessões Baileys — precisam persistir entre restarts. Remova se usar só WhatsApp Cloud API.
      - ./whatsapp-sessions:/app/whatsapp-sessions
      # Se usa firebase-admin com service account file, monte aqui (não inclua na imagem):
      - ./firebase-admin-service-account.json:/app/firebase-admin-service-account.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "1536M"
        reservations:
          cpus: "0.5"
          memory: "512M"
    networks:
      - app-net

  # Cloudflare Tunnel pro Next.js — só sobe com --profile tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: servicepro-app-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --protocol http2
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-net
    profiles:
      - tunnel

  # Cron interno — dispara endpoints scheduled do saas-erp.
  # Self-contained (não depende de cron-job.org externo). Roda sempre.
  #   - process-scheduled (broadcasts):           a cada 1 minuto
  #   - appointments/run-reminders (lembretes):   a cada 5 minutos (minuto % 5 == 0)
  #   - fiscal/cron/transmit-contingencia:        a cada 30 minutos (HH:00 e HH:30)
  #   - agent/scheduled/run (agente IA):          a cada 1 hora (HH:00)
  #   - birthday-campaigns/run (aniversário):     a cada 1 hora (HH:00)
  #   - fiscal/cron/consultar-processando:        a cada 1 hora (HH:00)
  #   - data-retention/run (purge LGPD soft-deletes >30d): 1x ao dia, 03:00
  # Todos autenticam com Authorization: Bearer ${CRON_SECRET}
  # Usa o nome do serviço Docker (`app:3000`) na rede interna — não vai
  # pelo Cloudflare/internet (mais rápido e não consome quota tunnel).
  #
  # Wall-clock alignment (importante): o loop dorme até o próximo minuto cheio
  # do relógio (date +%S), em vez de `sleep 60` puro. Antes contávamos TICK %
  # 60 desde o start do container — se subisse às 11:30, tasks "horárias"
  # rodavam às 11:30, 12:30... NUNCA às HH:00. Campanha agendada pra meio-dia
  # nunca casava com `currentHour === 12` no runner. Agora roda no topo da
  # hora real.
  cron:
    image: alpine:3.19
    container_name: servicepro-cron
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      - CRON_SECRET=${CRON_SECRET}
    command: |
      sh -c '
        apk add --no-cache curl > /dev/null 2>&1
        echo "[cron] iniciado — process-scheduled 1min, appointments-reminders 5min, fiscal-contingencia 30min, agent+birthday+fiscal-consulta 1h (HH:00), data-retention diario 03:00"

        call_endpoint() {
          # $$1=path, $$2=timeout
          curl -fsS -m "$$2" -o /dev/null \
            -H "Authorization: Bearer $$CRON_SECRET" \
            "http://app:3000$$1" \
            || echo "[cron] $$1 falhou em $$(date -Iseconds)"
        }

        while true; do
          # Dorme até o próximo minuto cheio (00 segundos do relógio).
          # date +%S retorna 00-59; subtraímos pra calcular o gap.
          # Se já estamos exatamente em :00 (raro), pula o sleep.
          SECS_LEFT=$$((60 - $$(date +%S)))
          [ "$$SECS_LEFT" -lt 60 ] && [ "$$SECS_LEFT" -gt 0 ] && sleep "$$SECS_LEFT"

          # broadcasts: a cada minuto
          call_endpoint "/api/broadcasts/process-scheduled" 30

          # lembretes de agendamento: a cada 5min (minuto múltiplo de 5).
          # Runner é idempotente — cron rodando "off by one minute" não duplica.
          # Janela ±5min em torno de 60min/30min cobre o gap sem perder appts.
          MIN_NOW=$$(date +%M)
          if [ "$$((10#$$MIN_NOW % 5))" = "0" ]; then
            call_endpoint "/api/appointments/run-reminders" 60
          fi

          # fiscal/contingencia: a cada 30min (HH:00 e HH:30). Transmite
          # NFC-e em status='contingencia' pra SEFAZ quando o serviço voltar.
          # Idempotente via lastCronAttemptAt; respeita janela 30min-23h
          # depois de dhCont. Timeout generoso (3min) pra varrer até 50 docs.
          if [ "$$((10#$$MIN_NOW % 30))" = "0" ]; then
            call_endpoint "/api/fiscal/cron/transmit-contingencia" 180
          fi

          # tarefas horárias: só dispara quando minuto == 00.
          # Sequencial pra evitar pico simultâneo na app.
          if [ "$$MIN_NOW" = "00" ]; then
            call_endpoint "/api/agent/scheduled/run" 60
            call_endpoint "/api/birthday-campaigns/run" 120

            # fiscal/consulta-status: 1h. Atualiza docs em status='processando'
            # consultando SEFAZ pela chave de acesso. Cenário raro (sefaz-api
            # responde síncrono em ~99% dos casos), ciclo conservador. Timeout
            # 3min pra cobrir até 50 docs.
            call_endpoint "/api/fiscal/cron/consultar-processando" 180

            # data-retention: 1x ao dia, 03:00 — purga soft-deletes >30d.
            # Janela de baixo tráfego pra n competir com cargas diurnas.
            # Runner é idempotente (re-rodar n duplica), timeout 5min generoso
            # pra varrer múltiplos businesses.
            HOUR_NOW=$$(date +%H)
            if [ "$$HOUR_NOW" = "03" ]; then
              call_endpoint "/api/data-retention/run" 300
            fi
          fi
        done
      '
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
    name: servicepro-app-net
