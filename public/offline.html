<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sem conexão — Aevo</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #ffffff; color: #111827; text-align: center;
    }
    main { max-width: 360px; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { margin: 20px 0 8px; font-size: 22px; }
    p { margin: 0 0 24px; font-size: 16px; line-height: 1.5; color: #4b5563; }
    button {
      min-height: 48px; padding: 0 28px; border: 0; border-radius: 14px; background: #dc2626; color: #fff;
      font-size: 16px; font-weight: 600; touch-action: manipulation;
    }
    button:active { background: #b91c1c; }
    @media (prefers-color-scheme: dark) {
      body { background: #030712; color: #f9fafb; }
      p { color: #9ca3af; }
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="64" height="64">
    <h1>Sem conexão</h1>
    <p>O Aevo precisa de internet para funcionar. Confira o Wi-Fi e tente de novo — o que você já salvou está guardado.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
  <script>
    // Voltou a rede com a página aberta: recarrega sozinho.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
