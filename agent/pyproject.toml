[project]
name = "servicepro-agent"
version = "0.1.0"
description = "Autonomous AI agent for ServicePro — LangGraph-powered concierge for orders & appointments."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    # LangGraph + LangChain stack
    "langgraph>=0.2.40",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.10",
    "openai>=1.55.0",
    # Observability — used for @traceable decorator + metadata tagging.
    # Auto-no-op when LANGCHAIN_API_KEY is absent.
    "langsmith>=0.1.120",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",       # mock httpx
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
